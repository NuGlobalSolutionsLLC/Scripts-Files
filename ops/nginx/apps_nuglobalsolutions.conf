    # Revalidate the AFP4 application shell and GIS data on every use so
    # deployments do not leave browsers on stale bundles or well layers.
    location = /AFP4/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /AFP4/data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Private AFP4 site - with its own root
    location ^~ /AFP4 {
        root /var/www/html/apps;
        index index.html;
        try_files $uri $uri/ /AFP4/index.html =404;
        
        # Prevent any redirects to AFP04
        location ~ ^/AFP4/.*$ {
            try_files $uri $uri/ /AFP4/index.html =404;
        }
    }

    # Storymap site
    location /storymap/afp4 {
        try_files $uri $uri/ /storymap/afp4/index.html;
    }

    # Revalidate the Public shell so deployments select current hashed assets.
    location = /AFP04/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Public AFP04 site and default routing
    location / {
        try_files $uri $uri/ @router;
    }

    location @router {
        rewrite ^.*$ /AFP04/index.html last;
    }

    # PHP handling if needed
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php7.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

server {
    listen 80;
    server_name  app.nuglobalsolutions.com;
    return 301 https://app.nuglobalsolutions.com$request_uri;
}

server {
    listen 443;
    ssl on;
    ssl_certificate /etc/ssl/certs/www.nuglobalsolutions.com.crt;
    ssl_certificate_key /etc/ssl/private/www.nuglobalsolutions.com.key;
    ssl_ciphers  HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;
    ssl_protocols TLSv1.2 TLSv1.1 TLSv1;
    server_name app.nuglobalsolutions.com;

    root /var/www/html/apps;
    index index.html index.htm;


